<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" role="img" aria-labelledby="edda-plan-title edda-plan-desc"><title id="edda-plan-title">Bedroom plan with Edda facing the bed</title><desc id="edda-plan-desc">Furniture arrangement showing a walnut four-door Edda directly opposite the Frame bed, with a reading chair to one side. The solid wall is confirmed by the owner. Room width, wall length and the location of windows and doors are not established here.</desc><defs><marker id="edda-arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#8a795d"/></marker></defs><g font-family="Arial,sans-serif" fill="#4a4236"><text x="42" y="25" font-size="17" font-weight="bold">Your view from bed → Edda on the solid wall</text><text x="42" y="47" font-size="12">Furniture footprints to scale; room boundaries and openings unmeasured.</text><g transform="translate(28 55)"><path d="M125 40H485" stroke="#736b60" stroke-width="8"/><text x="305" y="25" text-anchor="middle" font-size="12">Solid wall confirmed; clear width to measure</text><rect x="173" y="45" width="254" height="50.8" rx="2" fill="#76543b" stroke="#60432e" stroke-width="1.5"/><path d="M237 48v44M300 48v44M363 48v44" stroke="#a68863"/><text x="300" y="67" text-anchor="middle" font-size="14" fill="#fff9ed">Edda 4 · walnut</text><text x="300" y="84" text-anchor="middle" font-size="11" fill="#fff9ed">254 × 50.8 cm</text><rect x="117.1" y="133" width="365.8" height="274.3" rx="3" fill="#e8dfcc"/><text x="145" y="151" font-size="12">Existing Marea rug</text><path d="M92 98V213" stroke="#8a795d" marker-start="url(#edda-arrow)" marker-end="url(#edda-arrow)"/><text x="52" y="174" font-size="12" transform="rotate(-90 52 174)">120 cm preferred aisle</text><rect x="197" y="215.8" width="206" height="236.5" rx="6" fill="#eadfc9" stroke="#75583f" stroke-width="3"/><rect x="204" y="224" width="192" height="179" rx="4" fill="#faf6eb" stroke="#d5c9b4"/><rect x="210" y="409" width="81" height="32" rx="4" fill="#fffaf2"/><rect x="309" y="409" width="81" height="32" rx="4" fill="#fffaf2"/><text x="300" y="287" text-anchor="middle" font-size="17">Frame 765 AC</text><text x="300" y="309" text-anchor="middle" font-size="12">206 × 236.5 cm</text><path d="M300 273V170" stroke="#8a795d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#edda-arrow)"/><rect x="136.2" y="409.1" width="50.8" height="43.2" fill="#cfbd99" stroke="#aa9270" stroke-dasharray="4 3"/><rect x="413" y="409.1" width="50.8" height="43.2" fill="#cfbd99" stroke="#aa9270" stroke-dasharray="4 3"/><text x="157" y="397" text-anchor="middle" font-size="11">Pair?</text><text x="438" y="397" text-anchor="middle" font-size="11">Pair?</text><rect x="498" y="234" width="85" height="83" rx="18" fill="#e5dac4" stroke="#75583f" stroke-width="2"/><text x="540" y="268" text-anchor="middle" font-size="13">Elysia</text><text x="540" y="287" text-anchor="middle" font-size="11">face into room</text><circle cx="565" cy="354" r="22.5" fill="#d9c8a7" stroke="#a28d68" stroke-dasharray="5 4"/><text x="565" y="358" text-anchor="middle" font-size="11">FAD?</text><text x="510" y="191" font-size="12">Place near a window.</text><text x="510" y="208" font-size="12">Exact side to confirm.</text><path d="M133 462H466" stroke="#6e6558" stroke-width="9"/><text x="300" y="490" text-anchor="middle" font-size="12">Existing freestanding bed wall</text><path d="M87 540V428M500 540V428" stroke="#8a795d" stroke-dasharray="5 5" marker-end="url(#edda-arrow)"/><text x="40" y="568" font-size="12">Keep both passages around the bed wall open.</text><text x="40" y="598" font-size="12">Bed + Edda depth: about 4.23 m with the preferred 120 cm aisle,</text><text x="40" y="617" font-size="12">including 10 cm behind the bed and 5 cm behind the credenza.</text></g></g></svg>