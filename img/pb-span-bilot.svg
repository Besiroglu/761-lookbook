<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 355" role="img" aria-labelledby="pb-title-bilot"><title id="pb-title-bilot">Two Bilot bedside tables around a 206cm Frame bed, requiring 346cm total width before outside passages</title><g font-family="Arial,sans-serif" fill="#514737"><text x="230" y="17" text-anchor="middle" font-size="12">Matching pair, one on each side</text><path d="M57 40 H403 M57 34v12 M403 34v12" stroke="#806b53"/><text x="230" y="34" text-anchor="middle" font-size="13">346 cm total span</text><rect x="127" y="60" width="206" height="236.5" rx="5" fill="#e7dac1" stroke="#795b40" stroke-width="3"/><rect x="136" y="72" width="84" height="37" rx="5" fill="#fffaf2"/><rect x="240" y="72" width="84" height="37" rx="5" fill="#fffaf2"/><rect x="136" y="119" width="188" height="168" rx="4" fill="#f8f3e8"/><text x="230" y="190" text-anchor="middle" font-size="16">Frame 765 AC</text><text x="230" y="212" text-anchor="middle" font-size="12">206 × 236.5 cm</text><rect x="57" y="67" width="60" height="44" rx="4" fill="#997553" stroke="#806b53"/><rect x="64" y="73" width="28" height="17.5" rx="2" fill="#fffaf0" stroke="#b8ac97"/><text x="87.0" y="127" text-anchor="middle" font-size="10">60 × 44</text><rect x="343" y="67" width="60" height="44" rx="4" fill="#997553" stroke="#806b53"/><rect x="350" y="73" width="28" height="17.5" rx="2" fill="#fffaf0" stroke="#b8ac97"/><text x="373.0" y="127" text-anchor="middle" font-size="10">60 × 44</text><text x="230" y="322" text-anchor="middle" font-size="11">10 cm gap on each side of the bed</text><text x="230" y="341" text-anchor="middle" font-size="10">Furniture to scale. Wall and outside passages not shown.</text></g></svg>